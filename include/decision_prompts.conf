/* Shared instructions, in order. The broker joins these rows with spaces. */
DECISION_OVERALL("Choose one offered action for this monster's turn. Consider survival, equipment, the perceived hero and nearby creatures, and the outcomes suggested by recent history.")
DECISION_OVERALL("Coordinates are level squares, north is decreasing y. History is oldest first.")
DECISION_OVERALL("Use combat and items when they serve the encounter. NetHack resolves the attempt.")

